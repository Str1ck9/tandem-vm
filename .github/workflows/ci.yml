# Continuous integration: build, Swift tests (portable ones; see the notes below) and Rust tests on a hosted macOS runner.
name: CI
# The workflow only reads the repository.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Swift build
        working-directory: host
        run: swift build
      - name: Swift tests
        working-directory: host
        # Some tests need local sockets, disk images or a signed app; those skip or may fail on a hosted runner.
        # Two helper tests attach real disk images and talk to diskutil, which the hosted runner does not allow.
        run: swift test --skip testDiskThatIsDroppedWithoutReleaseStaysUnmounted --skip testOnlyWholeUSBDisksAreHandedOver
        env:
          # The hosted runner is smaller than the Macs the tests' settings assume (4 CPUs, 8 GB).
          TANDEM_HOST_CPUS: "8"
          TANDEM_HOST_MEMORY_MIB: "16384"
      - name: Rust tests
        working-directory: guest
        run: cargo test --locked
